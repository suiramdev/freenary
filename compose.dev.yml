name: freenary

x-app-build: &app-build
  context: .
  dockerfile: .docker/dockerfile.dev

x-app-watch: &app-watch
  - action: sync
    path: ./apps
    target: /app/apps
    ignore:
      - node_modules/
      # Generated on each side by the paraglide compile step: syncing the host
      # copy over the container's deletes it mid-session, and Vite caches the
      # failed resolution of `@/paraglide/server.js` into a permanent 500.
      - web/src/paraglide/
  - action: sync
    path: ./packages
    target: /app/packages
    ignore:
      - node_modules/
  - action: rebuild
    path: ./bun.lock

x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-freenary}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev_secret_change_me_at_least_32chars}
  # OrbStack fronts *.orb.local with auto-HTTPS (trusted local CA); browsers land on
  # https, so these origins must be https or the SPA's cross-origin calls fail CORS.
  BETTER_AUTH_URL: https://${SERVER_HOST:-server.freenary.orb.local}
  CORS_ORIGIN: https://${WEB_HOST:-web.freenary.orb.local}
  NODE_ENV: development
  # Prints one-time codes to the server log instead of sending them, so the OTP
  # flows work with no mail account. `createEmailProvider` refuses it in production.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
  EMAIL_FROM: ${EMAIL_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
  APPLE_APP_BUNDLE_IDENTIFIER: ${APPLE_APP_BUNDLE_IDENTIFIER:-}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-}
  AUTH_PASSWORD_BREACH_CHECK: ${AUTH_PASSWORD_BREACH_CHECK:-}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
  ENABLE_BANKING_PRIVATE_KEY: ${ENABLE_BANKING_PRIVATE_KEY:-}
  BANKING_PROVIDER: ${BANKING_PROVIDER:-}
  POWENS_DOMAIN: ${POWENS_DOMAIN:-}
  POWENS_CLIENT_ID: ${POWENS_CLIENT_ID:-}
  POWENS_CLIENT_SECRET: ${POWENS_CLIENT_SECRET:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freenary}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    expose:
      - "${POSTGRES_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-freenary}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: applies pending migrations before the server starts.
  # Re-runs on every `up` (idempotent); exits 0 when the schema is current.
  bootstrap:
    build: *app-build
    working_dir: /app/packages/db
    command: bun x prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-freenary}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: *app-build
    working_dir: /app/apps/server
    command: bun run --hot src/index.ts
    environment:
      <<: *app-env
    labels:
      # OrbStack's built-in proxy serves this container at server.freenary.orb.local;
      # ignored outside OrbStack.
      - dev.orbstack.domains=${SERVER_HOST:-server.freenary.orb.local}
      - dev.orbstack.http-port=3000
    develop:
      watch: *app-watch
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: *app-build
    working_dir: /app/apps/web
    command: bun run dev -- --host 0.0.0.0
    environment:
      VITE_SERVER_URL: https://${SERVER_HOST:-server.freenary.orb.local}
      # What the web app's own server calls while rendering a page: the
      # container network, since OrbStack's local CA is not trusted inside it.
      SERVER_URL: ${SERVER_URL:-http://server:3000}
    labels:
      - dev.orbstack.domains=${WEB_HOST:-web.freenary.orb.local}
      - dev.orbstack.http-port=3001
    develop:
      watch: *app-watch
    depends_on:
      - server
    restart: unless-stopped

  docs:
    build: *app-build
    working_dir: /app/apps/fumadocs
    command: bun run dev -- --host 0.0.0.0
    environment:
      DOCS_PORT: ${DOCS_PORT:-4000}
    labels:
      - dev.orbstack.domains=${DOCS_HOST:-docs.freenary.orb.local}
      - dev.orbstack.http-port=4000
    develop:
      watch: *app-watch
    restart: unless-stopped

volumes:
  pgdata:
