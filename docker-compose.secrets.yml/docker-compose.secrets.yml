# Optional override: run the stack with Docker secrets instead of plain
# values in `.env`. Secrets are read from files, so the values never sit
# in the environment of the host shell or in the Compose file itself.
#
# Usage:
#   1. Create the files under `./secrets/` (one value per file, a trailing
#      newline is fine). For example, write the database URL to
#      `./secrets/database-url.txt` and the auth secret to
#      `./secrets/better-auth-secret.txt`.
#   2. Remove `BETTER_AUTH_SECRET` from `.env`. Setting both a variable and
#      its `_FILE` form stops the server at startup, on purpose.
#   3. Run: docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# The `migrate` service builds its `DATABASE_URL` from `POSTGRES_PASSWORD`
# in the base file, so the override clears it and points it at the secret
# file instead. The server keeps the rest of its environment from `.env`.
services:
  server:
    environment:
      BETTER_AUTH_SECRET_FILE: /run/secrets/better-auth-secret
    secrets:
      - better-auth-secret
  migrate:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database-url
    secrets:
      - database-url
secrets:
  better-auth-secret:
    file: ./secrets/better-auth-secret.txt
  database-url:
    file: ./secrets/database-url.txt
