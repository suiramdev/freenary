name: Release

# Cuts a release from main: tags vX.Y.Z, publishes the versioned images, then
# opens a GitHub release with generated notes. Run it from the Actions tab.
#
# Day to day, pull requests land on dev, which publishes the `dev` images.
# A release is dev merged into main, then this workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, without the v, such as 1.2.0 or 1.3.0-rc.1
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: refs/tags/v${{ inputs.version }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are cut from main, not from ${GITHUB_REF#refs/heads/}" >&2
          exit 1

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Not a version: $VERSION (expected X.Y.Z or X.Y.Z-pre)" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse an existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists" >&2
            exit 1
          fi

      - name: Find the previous release
        id: previous
        run: echo "tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Freenary $VERSION"
          git push origin "refs/tags/v$VERSION"

  images:
    needs: tag
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ needs.tag.outputs.ref }}
    permissions:
      contents: read
      packages: write

  publish:
    needs: [tag, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.ref }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ needs.tag.outputs.previous }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "## Images"
            echo
            echo "- \`$image-server:$VERSION\`"
            echo "- \`$image-web:$VERSION\`"
            echo
            echo "Both for linux/amd64 and linux/arm64. \`FREENARY_VERSION=$VERSION\` in \`.env\` pins a stack to them."
            echo
          } > /tmp/notes.md
          args=(--title "Freenary $VERSION" --notes-file /tmp/notes.md --generate-notes)
          [[ -n "$PREVIOUS" ]] && args+=(--notes-start-tag "$PREVIOUS")
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          gh release create "v$VERSION" "${args[@]}"
