name: Generate merchant data

on:
  schedule:
    # Monday 03:00 UTC — fresh data for the work week
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/api/scripts/**"
      - "packages/api/src/categorisation/features.ts"
      - "packages/api/src/categorisation/normalise/**"
      - "packages/api/src/categorisation/sirene/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile --ignore-scripts

      # Restore and save are split so a run that dies mid-pass still publishes
      # what it fetched: `actions/cache` skips its save on a cancelled job, which
      # is why every SIRENE lookup was repeated from scratch on the next run.
      - name: Restore SIRENE API cache
        uses: actions/cache/restore@v4
        with:
          path: packages/api/.cache/sirene
          key: sirene-${{ github.run_id }}
          restore-keys: sirene-

      - name: Generate independent data (parallel)
        working-directory: packages/api
        run: |
          bun scripts/generate-place-tokens.ts &
          bun scripts/fetch-wikidata-brands.ts &
          wait

      - name: Build merchant dictionary
        run: bun scripts/build-merchant-dictionary.ts
        working-directory: packages/api

      - name: Save SIRENE API cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: packages/api/.cache/sirene
          key: sirene-${{ github.run_id }}

      # `--ignore-scripts` above skipped `prisma generate`; the trainer imports
      # the client even when it reads no corrections.
      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: packages/db

      # The gate refusing is the expected outcome until contributed data exists
      # (ADR-004 §6–7): it exits 2, leaves no weights file, and must not fail the
      # run. Anything else non-zero is a crash and does. PIPESTATUS, not $?:
      # the default shell has no pipefail, so $? would be tee's.
      - name: Train classifier
        id: train
        working-directory: packages/api
        run: |
          set +e
          bun scripts/train-model.ts --dictionary-only 2>&1 | tee /tmp/train.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Classifier training"
            echo
            echo '```'
            cat /tmp/train.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0)
              test -f data/model-weights.json
              echo "weights=attached" >> "$GITHUB_OUTPUT" ;;
            2)
              test ! -f data/model-weights.json
              echo "weights=refused by the shipping gate, none attached" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Create release tarball
        run: |
          cd packages/api
          tar -czf /tmp/merchant-data.tar.gz \
            data/place-tokens.json \
            data/merchants.jsonl.gz \
            $([ -f data/wikidata-brands.json ] && echo data/wikidata-brands.json || true) \
            $([ -f data/model-weights.json ] && echo data/model-weights.json || true)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          WEIGHTS: ${{ steps.train.outputs.weights }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d)"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" /tmp/merchant-data.tar.gz \
            --title "Merchant data $(date -u +%Y-%m-%d)" \
            --notes "Auto-generated merchant dictionary (NSI + Wikidata + SIRENE). Classifier weights: $WEIGHTS." \
            --latest=false
