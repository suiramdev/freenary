name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint & format
        run: bun run check

      - name: Type check
        run: bun run check-types

      # The build catches a missing title and an unknown fence language. This
      # catches the icons, components, links, navigation and language rules it
      # does not.
      - name: Documentation
        run: bun run docs:check

      - name: Build
        run: bun run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Both files must still parse, and the production one must still refuse
      # to start without its two secrets.
      - name: Validate the compose files
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          printf 'POSTGRES_PASSWORD=x\nBETTER_AUTH_SECRET=y\n' > .env
          docker compose -f docker-compose.yml config --quiet
          : > .env
          if docker compose -f docker-compose.yml config --quiet 2>/dev/null; then
            echo "docker-compose.yml accepted an empty POSTGRES_PASSWORD and BETTER_AUTH_SECRET" >&2
            exit 1
          fi
