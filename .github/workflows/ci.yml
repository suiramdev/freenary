name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  # .github/workflows/renovate-lockfile.yml calls this after it commits
  # bun.lock: a push it makes with GITHUB_TOKEN starts no workflow of its own,
  # and dispatch is what GitHub exempts from that rule.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint & format
        run: bun run check

      - name: Type check
        run: bun run check-types

      # The layer, slice and public-API rules of Feature-Sliced Design in
      # `apps/web` and `apps/fumadocs`. Nothing else catches an import that
      # reaches up a layer or past a slice's index.
      - name: Architecture
        run: bun run check:fsd

      # The build catches a missing title and an unknown fence language. This
      # catches the icons, components, links, navigation and language rules it
      # does not.
      - name: Documentation
        run: bun run docs:check

      # .env.example and the configuration reference are generated from
      # packages/env/src/schema.ts. This also refuses a variable the code reads
      # and nothing declares.
      - name: Environment
        run: bun run env:check

      - name: Build
        run: bun run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Both files must still parse, and the production one must still refuse
      # to start without its two secrets.
      - name: Validate the compose files
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.dev.yml -f docker-compose.mail.yml config --quiet
          docker compose -f docker-compose.proxy.yml config --quiet
          printf 'POSTGRES_PASSWORD=x\nBETTER_AUTH_SECRET=y\n' > .env
          docker compose -f docker-compose.yml config --quiet
          : > .env
          if docker compose -f docker-compose.yml config --quiet 2>/dev/null; then
            echo "docker-compose.yml accepted an empty POSTGRES_PASSWORD and BETTER_AUTH_SECRET" >&2
            exit 1
          fi
